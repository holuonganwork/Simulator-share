# Chương trình TÂN BINH — cấu trúc THẬT từ greensm.com (fetch 2026-07-26, Q-01):
#   bike: combo đồng phục 810k miễn phí, TRUY THU nếu <200 cuốc/tháng trong 2 tháng đầu;
#   mốc ≥50 cuốc trong 7 ngày đầu (điều kiện thưởng chuyển nền tảng);
#   "bảo lãnh doanh thu" 90 ngày đầu — SỐ TIỀN nằm trong ảnh (image-locked, D-POL-05).
# Các SỐ TIỀN dưới đây là PROXY/ASSUMPTION (tham chiếu cấu trúc taxi 3M/90 ngày, scale bike):
newbie_program:
  enabled: true
  tenure_newbie_max_days: 90       # "tài xế mới" = tenure < 90 ngày (khớp cửa sổ bảo lãnh)
  first_week_trip_target: 50       # THẬT (greensm.com: ≥50 cuốc trong 7 ngày đầu)
  first_week_bonus_vnd: 500000     # PROXY — bike scale từ cấu trúc taxi 700k×3
  guarantee_days: 90               # THẬT (bảo lãnh doanh thu 90 ngày)
  guarantee_gross_floor_vnd: 350000  # PROXY/ASSUMPTION — sàn doanh số/ngày khi đủ chuyên cần
  guarantee_min_online_h: 6.0      # chống lạm dụng: chỉ bù khi thực sự vận doanh
  combo_value_vnd: 810000          # THẬT (combo đồng phục 810.000đ)
  combo_min_trips_per_month: 200   # THẬT (điều kiện giữ combo 2 tháng đầu)

# Mission ngày (nền cho solver S6 mission_knapsack có kênh tác động).
# Catalog MOCK — cấu trúc mô phỏng "Nhiệm Vụ Tiếp Theo" trong app (research đợt 4);
# số tiền/mốc là MOCK, số thật image-locked (D-POL-05).
missions:
  enabled: true
  daily_catalog:
    - {mission_id: m-morning4,  name: "4 cuốc khung sáng 6-9h",   window: [6, 9],   target: 4,  reward_vnd: 20000}
    - {mission_id: m-evening6,  name: "6 cuốc khung tối 17-20h",  window: [17, 20], target: 6,  reward_vnd: 30000}
    - {mission_id: m-allday12,  name: "12 cuốc trong ngày",       window: null,     target: 12, reward_vnd: 40000}

# E10b §4.7 — observer log-only cho control-run (World A): per-cell (n_idle, median streak)
