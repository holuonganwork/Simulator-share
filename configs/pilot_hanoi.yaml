# trôi hiệu chỉnh SIM-1/P1). p_rated: không phải cuốc nào khách cũng chấm.
rating:
  p_rated: 0.75                    # ASSUMPTION (không có số công khai); benchmark 5★ ~0.78
  p5_by_archetype:                 # chất lượng phục vụ theo kinh nghiệm — ASSUMPTION có lập luận
    P1: 0.74
    P2: 0.80
    P3: 0.88                       # top: điểm sao cao là lý do họ là top
    P4: 0.68                       # tân binh: sai đường/chậm nhiều hơn
    P5: 0.85
    P6: 0.78
    P7: 0.76
