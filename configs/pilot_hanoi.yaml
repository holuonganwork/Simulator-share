# === BIẾN MÔI TRƯỜNG (specs/environment-variables.md) — mọi factor tắt được về 1 ===
# scenario mặc định = dry_weekday (không mưa/sự kiện) → baseline. Đổi trên UI hoặc override.
environment:
  scenario: dry_weekday
  rain:
    # series: [] không mưa | [[t_min, mm/h],...] cố định | auto: sinh đợt mưa ngắn
    series: []
    auto: null                    # {duration_min_per_day: 30, peak_mmph: 12, window_min: [900,1200]}
    demand: {delta_peak: 0.22, r_peak_mmph: 8.0}      # unimodal: tăng rồi giảm
    speed:  {r_max: 0.28, r0_mmph: 9.0, v_floor_kmh: 7.0}
    supply: {r_s_mmph: 10.0, p_cap: 0.5,
             alpha: {P1: 0.45, P2: 0.20, P3: 0.10, P4: 0.15, P5: 0.30,
                     P6: 0.25, P7: 0.35}}   # MOCK — độ tin thấp, hỏi tài xế sau
             # P6 sáng sớm / P7 đêm: nhạy mưa hơn TB (tầm nhìn kém, đường trơn) — ASSUMPTION
  temp:
    const_c: 28.0
    series: []
    demand_factor: 1.0            # off (độ tin thấp)
    range: {t_opt_hi_c: 30.0, beta_hot_per_c: 0.005, floor: 0.85}
  dow:
    type: weekday                 # weekday | friday | weekend
    level: {weekday: 1.0, friday: 1.10, weekend: 1.05}
  # events: [{venue_cell, t_start_min, t_end_min, attendance, capture_rate, sigma_cells,
  #           route_effect: {speed_multiplier: 0.6, sigma_cells: 1.5}}]  # route_effect = giảm tốc cục bộ (survival)
  events: []
  combine:
    demand_total_clamp: [0.3, 3.0]
    log_raw_and_capped: true

# === CƠ CHẾ LÀM GIÀU DỮ LIỆU & SỰ KIỆN ĐỘNG (gsm_sim/event) ===
event_dynamics:
  enabled: true                    # Bật/tắt toàn bộ cơ chế biến thiên ngày & thời tiết
  start_date: "2026-07-01"         # Ngày xuất phát của chuỗi mô phỏng
  demand_variation:
    enabled: true
    stochastic_sigma: 0.045        # Nhiễu hàng ngày ~4.5%
    stochastic_clamp: [0.88, 1.15] # Giới hạn nhiễu an toàn
  weather:
    enabled: true
    pleasant_speed_mult: 1.00
    pleasant_demand_mult: 1.00
    rain_speed_mult: 0.85          # Mưa: vận tốc giảm ~15%
    rain_demand_mult: 0.92         # Mưa: khách giảm ~8%
    fog_speed_mult: 0.58           # Sương mù: vận tốc giảm ~42%
    fog_demand_mult: 0.94          # Sương mù: khách giảm ~6%
    flood_city_demand_mult: 0.72   # Lũ lụt: cầu toàn thành giảm ~28%
    flood_severe_speed_mult: 0.25  # Lũ lụt: ô ngập vừa vận tốc giảm trầm trọng còn 25% (3-5 km/h)
    probabilities:
      pleasant: 0.78               # Mát trời cao nhất: 78%
      rain: 0.18                   # Trời mưa ít hơn: 18%
      fog: 0.025                   # Sương mù siêu hiếm: 2.5%
      flood: 0.015                 # Lũ lụt/ngập úng siêu hiếm: 1.5%

output:
  runs_dir: runs

# --- SIM-3: cầu nối advice → action (UPDATE-046) ---
# MẶC ĐỊNH TẮT. Bật lên là chuyển từ "World A: tự làm" sang "World B: làm theo chỉ dẫn".
# SIM-4 sẽ chạy 2 nhánh cùng seed, chỉ khác cờ này (paired-seed / CRN).
advice:
  enabled: false
  # Ai được nhận advice: none | single (theo `single_actor_id`) | share (theo `share`) | all
  # Cường chốt 2026-07-26: mặc định **1 tài xế** — để SIM-4 đo được ảnh hưởng RIÊNG lên
  # người đó, không bị nhiễu bởi việc cả thị trường cùng đổi hành vi. Bật `all` sau để
  # kiểm guardrail (advice có làm xấu queue trạm / served của hệ thống không).
  coverage: single
  single_actor_id: null            # null = lấy tài xế P4 (tân binh) đầu tiên; xem runner
  share: 0.0                       # chỉ dùng khi coverage=share
  interval_min: 30                 # tài xế không mở app 30 giây/lần
  # SIM-4: mỗi KÊNH tác động bật/tắt RIÊNG ⇒ đo được kênh nào tạo ra giá trị (attribution).
  channels:
    # ⛔ shift_plan TẮT theo điều khoản BẢN-CUỐI của ĐA-07 — Cường DUYỆT 2026-07-28 (UPDATE-087).
    # Bằng chứng đúng chuẩn: n=100 seed TƯƠI, so biến thể hợp lệ đầu tiên (B1 vs B3w) — thêm
    # shift_plan trên nền positioning: thu nhập ns, served −0,33đp SIG, đơn chết +4,1 SIG,
    # Gini/HHI nhích xấu SIG. "Không hiệu quả thì TẮT để advisor IM LẶNG" — đây là lệnh đó.
    # Bật lại để nghiên cứu: đổi true + đọc lại UPDATE-085 (REST visibility) trước.
    shift_plan: false              # S2 shift_dp → REST/SWAP/END (SIM-3) — OFF theo ĐA-07
    accept_lift: false             # cảnh báo tỷ lệ nhận dưới ngưỡng ĐỦ ĐIỀU KIỆN thưởng
    shift_extend: false            # hoãn kết ca khi SÁT mốc điểm
    rest_window: false             # D-SIM-03: dồn nghỉ/đổi pin vào khung vắng khách (solver S7)
    swap_early: false              # E4/E-03 (UPDATE-156): đổi pin SỚM lúc rảnh + trạm vắng
    station_choice: false          # E4/E-01: gợi TRẠM theo queue+pin+đường. ⛔ NO-GO bật mặc định
                                   #   (UPDATE-160, n=100): FAIL ĐA-08 1a (payout −33đ ns) + 1b
                                   #   (P1 −3.863đ ÂM-SIG) dù swap_wait −3,6′ SIG. Reopen: DEFERRED D-E4-06
  # ✅ Kênh VỊ TRÍ — Cường DUYỆT bật mặc định 2026-07-28 (UPDATE-087). PASS 9/9 ĐA-08 trên
  # n=100 seed tươi (payout_mean_all +6.016đ/người SIG · served +1,74đp · đơn chết −23,4 ·
  # Gini & HHI GIẢM · đội +541k · veto 8(b)/9(b) PASS). `wait_only` = chỉ ghi đè khi bản năng
  # là ĐỨNG CHỜ — không đụng go_swap/rest/end_shift (bài học REST). Equilibrium: hồ sơ
  # research/simulation/multi-agent-equilibrium.md (cân bằng tồn tại; phủ tăng không tự phá).
  positioning_overrides: wait_only
  # --- E10 (specs/simulation/e10-advisor-noisy.md §2.1). Default GIỮ nguyên đường cũ ---
  # Nguồn cầu của MarketStateProducer: oracle = λ config (đường hiện hành, bit-identical —
  # fingerprint 5 seed × 2 config đã kiểm 2026-07-31) | realized = λ̂ từ cuốc ĐÃ ĐÓN
  # (advisor mất λ — arm thí nghiệm). Giá trị lạ / trộn với market_demand_override ⇒ ValueError.
  market_demand_source: oracle
  realized_demand:
    window_buckets: 3              # k — placeholder; GIÁ TRỊ HEADLINE = k* từ procedure §6.2
                                   # (MAE one-step-ahead realized-only), đọc e10-prereg-locked.json
    min_pickups: 5                 # min_n TOÀN CỤC (per-ô sẽ tái tạo lỗi mẫu số D-M3-01)
  # Trigger của kênh vị trí: capacity (đường cũ — ứng viên = người ở ô cap_left==0, không đổi
  # một ký tự) | wait (E10b — ứng viên theo THỜI GIAN CHỜ của ô + zone-veto). Neo T=30′ ≈ 2×
  # median chờ hoà-vốn (14–18′), dưới trần cụt ~40–44′ của impatience 20′×2 (spec §4.2).
  positioning_trigger: capacity
  # --- Cycle 8 (UPDATE-198): trọng số KHOẢNG CÁCH TỚI MỐC thưởng trong hàm mục tiêu S4 ---
  # 0.0 = TẮT = hành vi trước cycle (`capacity_alloc` rẽ nhánh tường minh; vân tay 5 seed ghim ở
  # `tests/test_vi_tri_biet_moc.py::test_w0_KHONG_DOI_HANH_VI`).
  # Vì sao có: `UPDATE-195` đo được hàm thưởng BẬC THANG còn +5.067đ/người/ngày ngay cả khi giữ
  # TỔNG ĐIỂM cố định — tiền GSM trả thêm, không lấy của tài xế khác. Cơ chế mạnh nhất (ưu tiên
  # ĐIỀU PHỐI) bị §5 cấm; đây là đường hợp lệ: đổi AI ĐƯỢC KHUYÊN ĐI ĐÂU.
  # ⚠ Vì sao phải NHỎ: hạng tử mốc lật được chênh lệch SOC tới `w/(1−w)`×100 điểm ⇒ w=0,5 xoá
  # SẠCH thang ưu tiên pin (`world.py:443-444`: "người ít pin không nên bị kéo chạy rỗng").
  # Cộng sàn cứng `SOC_SAN_AN_TOAN_PCT = 20%` — dưới đó mốc KHÔNG mua được ưu tiên, bất kể w.
  positioning_tier_weight: 0.0
  # --- Cycle 21 (UPDATE-211): chọn Ô ĐÍCH theo GIÁ TRỊ thay vì KHOẢNG CÁCH ---
  # Mâu thuẫn nội tại được sửa: `gsm_core/features/market_state.py` xếp hạng ô đích theo
  # `sd_ratio` = cầu/cung hiệu dụng, rồi `world.py` VỨT thứ hạng đó đi và chọn ô GẦN NHẤT
  # ⇒ `sd_ratio` chỉ còn tác dụng LỌC, mất hẳn tác dụng CHỌN.
  # Đo trước khi viết code (3 seed, 432 lượt ứng viên): ô gần nhất ≠ ô sd_ratio cao nhất ở
  # 88,2% số lượt; sd_ratio trung vị 1,66 → 2,41 (+40%).
  # `nearest` = HÀNH VI HIỆN HÀNH, không đổi một ký tự (nhánh tường minh, vân tay 5 seed ghim
  # ở `tests/test_vi_tri_biet_moc.py`). Đổi sang `value` là ĐỔI HÀNH VI ⇒ cần đo lại A/B.
  # Cycle 22 (UPDATE-214, đang đo n=900) thêm chế độ `share` — chấm ô đích bằng **PHẦN CẦU KỲ VỌNG**
  # ⚠ Khuyết tật đã biết của bản đang đo (UPDATE-213): tài xế **tự đếm mình là đối thủ** (98% lượt)
  #   ⇒ thước thiên vị **ở lại gần chỗ cũ**. Không sửa giữa chừng để không làm hỏng phép đo.
  # thay vì `sd_ratio` (Cycle 21, kết quả ÂM) hay khoảng cách thuần.
  #   diem(C) = Σ_X expected_demand(X) / (1 + người gần X hơn C + 0,5×người ngang cự ly)
  # Vì sao: đo được `grid_disk(k=8)` phủ **87%** vùng pilot ⇒ tài xế ở ô nào cũng là ứng viên cho
  # gần hết số đơn; cái quyết định là **thứ hạng ETA**, không phải tỷ số cầu/cung của ô.
  # Tầm với suy TỪ `dispatcher.candidate_ring_k_max`, không gõ tay (chống trôi như `Q-07`).
  positioning_target_mode: nearest
  # Đơn vị `sd_ratio` trên mỗi km — chỉ dùng khi mode=value. Điểm hoà vốn đo được ≈ 0,8.
  # Đo dưới trần 2 km: phạt 0,4 đổi ô ở 54,4% lượt (+0,51 km) · phạt 1,2 ở 25,5% (+0,43 km);
  # cả hai giữ trọn +40% sd_ratio ⇒ công thức phạt TỰ LỌC những cải thiện rẻ.
  positioning_km_penalty: 0.8
  # ⛔ Lan can CỨNG, độc lập `positioning_km_penalty`: km THÊM so với ô gần nhất, không phải
  # khoảng cách tuyệt đối (trần tuyệt đối làm kênh TRƠ ở rìa vùng — họ lỗi `swap_early`
  # UPDATE-156). Thả tự do thì p90 khoảng cách thêm là +3,91 km; không ai nên bị gửi đi 3 km
  # rỗng vì một chỉ số PROXY (`expected_demand` là λ từ config, không phải cầu quan sát).
  positioning_max_extra_km: 4.5        # Res 7: nới từ 2.0km lên 4.5km vì khoảng cách giữa tâm 2 ô Res 7 kề nhau đã là ~2.2-2.4km
  positioning_wait:
    threshold_min: 30.0            # T — quét {15,20,25,30,35}; 45/60 LOẠI cấu trúc
    min_idle: 2                    # n_min theo Ô — n=1 là luật per-driver lách cửa sau
  # Kênh accept_lift: nâng TẠM THỜI accept_base khi tỷ lệ nhận dưới `bonus_min_acceptance`.
  # Căn cứ: policy.day_bonus() trả 0 khi acceptance < ngưỡng (0.85), BẤT KỂ điểm — nên tài
  # xế accept_base 0.80 (P4 tân binh) mất TOÀN BỘ thưởng. Đây là sự thật policy, tác động ở
  # mức TỶ LỆ, KHÔNG phải khuyên nhận/từ chối một đơn cụ thể (ranh giới sản phẩm §5).
  accept_lift_step: 0.10           # mỗi lần nghe lời nâng 10 điểm %
  accept_lift_max: 0.15            # trần: không biến tài xế thành người nhận mọi cuốc
  min_offers_before_lift: 5        # đủ mẫu rồi mới kết luận tỷ lệ
  # D-SIM-03: trần HOÃN nghỉ. Lan can bắt buộc — không được đẩy nghỉ đi vô hạn; ngoài ra
  # còn 2 lan can cứng trong code: SOC thấp và MỆT thật thì luôn cho nghỉ/đổi pin.
  # ⛔ POLICY_LOCKED (D-M3-08 §1.2b): đổi phải qua src/gsm_core/policy_locks.py + duyệt —
  # sweep/override sẽ NỔ PolicyLockViolation ngay khi dựng world. Cả khoá dưới cũng vậy.
  rest_defer_max_min: 120
  shift_extend_max_min: 60         # trần hoãn kết ca (không "chạy vô hạn")
  # E4/E-05 (UPDATE-155): kênh CON của shift_plan — chỉ nói khi lịch DP bảo KẾT CA sớm
  # (phần ca còn lại kỳ vọng ~0; DP sau ADV-01 đã cân mốc thưởng). Mặc định TẮT; bật khi đo
  # riêng giá trị lời khuyên kết-ca mà không kéo theo full shift_plan (ĐA-07 đã bác).
  shift_plan_end_only: false
  # E4/E-03 (UPDATE-156): kênh ĐỔI PIN SỚM lúc rảnh + trạm vắng (channels.swap_early bật/tắt).
  # band: chỉ khuyên khi SOC ∈ (ngưỡng, ngưỡng+band] — lần đổi kế là TẤT YẾU, chỉ đổi thời điểm.
  # idle: chỉ khuyên khi đã rảnh liên tục ≥ X phút — cơ hội mất gần 0.
  swap_early_band_pct: 15
  swap_early_idle_min: 10
  # E4/E-01: chỉ NÓI khi trạm khác tiết kiệm ≥ X phút tổng (đường + chờ) so với bản năng —
  # chênh vặt là "không có gì để nói" (R-08).
  station_choice_min_gain_min: 3
  # D-SIM-05 — CHỈ khuyên khi lời khuyên thực sự có ích.
  # ⚠ ĐÍNH CHÍNH 2026-08-07 (Cycle 2): hai dòng cũ ở đây khẳng định *"SIM-4 chứng minh hiệu ứng
  # VÁCH ĐÁ: nâng tỷ lệ mà KHÔNG chạm ngưỡng ⇒ tài xế ôm cuốc rẻ, mất 34k"*. Khẳng định đó
  # **ĐÃ BỊ RÚT** từ `UPDATE-048` §2 (2026-07-26): đo lại **30 seed** cho nhóm KHÔNG chạm ngưỡng
  # Δpayout **+18.207đ — DƯƠNG**, và *"−34k là một seed cá biệt"* (seed 1000). `UPDATE-048:56-60`
  # còn đo chính cổng dựng từ lý lẽ đó là **INERT**.
  # Vì sao phải sửa ở ĐÂY chứ không chỉ trong UPDATE: câu này đã **lan truyền đo được** — một
  # vòng audit sau (`mm-03 MI-8`) đọc đúng hai dòng này rồi dựng cả một finding lên chúng.
  # Giữ tham số, BỎ lý lẽ đã bị rút.
  max_realized_accept: 0.93        # tỷ lệ nhận cao nhất ĐẠT ĐƯỢC khi lift kịch trần (ĐO, không bịa)
  min_online_min_for_rate: 30      # dưới mức này chưa đủ lịch sử trong ca → dùng ước lượng lý thuyết
  trips_per_hour_est: 1.5          # ước lượng cuốc/giờ khi chưa có lịch sử (đo được ~1.4-1.5)
  # Cycle 2 (P3) — gộp TRẦN (`capacity_left`) theo ô CHA res-N thay vì từng ô res-9.
  # `null` = TẮT, đường cũ bit-identical (đã chứng minh bằng vân tay 5 seed).
  # Vì sao có: `slots = int(λ_ô // 1,5)` hỏi "ô 0,35 km này nuôi nổi mấy tài xế?" — với λ trung
  # vị 0,480 thì đáp án 0 ở **89,5%** ô-giờ có cầu, và slots=0 ⇒ ô BIẾN MẤT khỏi `ranked_cells`.
  # Nhưng dispatcher chào đơn bán kính 2,22 km ⇒ câu đúng là "VÙNG này nuôi nổi thêm mấy người?".
  # Gộp res-8: λ trung vị 2,750 · slots=0 còn 29,4% · tổng slots 190 → 618.
  # ⚠ Ô cha là phân hoạch RỜI NHAU (đĩa `grid_disk` chồng lấn ⇒ đếm trùng cầu).
  #
  # 🔴 2026-08-09 — GIỮ `null` **CÓ CHỦ Ý**, không phải quên bật. Cường ban đầu duyệt bật cả
  # cờ này lẫn `k=8`; đo tương tác 30 seed ghép cặp thì hai thứ **THAY THẾ nhau**:
  #     k=8 một mình      payout +6.945đ SIG · expired −29,1 · km rỗng 130,95′
  #     gộp trần một mình payout +2.240đ SIG · expired −15,5 · km rỗng 129,33′
  #     CẢ HAI            payout +6.038đ SIG · expired −31,0 · km rỗng 132,67′
  #     tương tác I(payout) = −3.146,8đ [−5.371,0; −838,8] **SIG** ⇒ dưới cộng tính
  # ⇒ Bật cả hai làm tài xế **MẤT 907đ/người** so với chỉ bật k=8, đổi lại 1,8 đơn/ngày và
  # tốn thêm 1,7′ km rỗng. Cơ chế: k=8 đã cho dispatcher với xa hơn nên đơn mà gộp trần lẽ ra
  # cứu được thì đã có người với tới; gộp trần khi đó chỉ ĐIỀU TÀI XẾ ĐI THÊM mà không đổi
  # lại được cuốc. Cường quyết: **chỉ k=8**.
  # ⚠ Code gộp trần vẫn nguyên và có test riêng — nó tắt vì **thừa ở k=8**, KHÔNG phải vì sai.
  # Nếu `k` đổi lại thì phải ĐO LẠI tương tác, không mặc nhiên bật.
  slots_pool_res: null
  # bucket của shift_dp khi advisor chạy TRONG SIM.
  # ⚠ ĐÍNH CHÍNH 2026-07-28 (b0-B): comment cũ ghi "khớp derive_shift_plan_input_l1r" — SAI.
  # `gsm_core/features/shift_plan.py` có `BUCKET_MIN = 30`, tức hai producer dùng bucket KHÁC
  # nhau cho cùng một solver. Hôm nay vô hại vì đường l1r chỉ được gọi trong test, chưa nối
  # consumer nào (`shift_dp.solve` có đúng MỘT call site production: `advice_bridge.py`).
  # Nhưng đây là bẫy: ai nối đường l1r vào sẽ thừa hưởng lệch 30 vs 60 y như BUG-S2-PARAMS.
  # Ghi nợ ở T-046 ("hai tên một sự thật").
  bucket_min: 60
  # Mức TUÂN THỦ theo archetype — ASSUMPTION có lập luận, CHƯA có số thật:
  # tân binh nghe nhiều nhất, top/lão làng đã có hệ thống riêng nên nghe ít nhất.
  # Cần hiệu chỉnh khi có dữ liệu adherence thật (khảo sát tài xế hoặc A/B thật).
  # ĐA-04 (duyệt 2026-07-27, thi công 2026-07-29) — NHỊP nói dùng chung sim/UI.
  # Số baseline do design chốt; design ghi rõ "tuning sau dựa telemetry, không bằng cảm
  # giác" ⇒ đừng vặn tay. Siết chặt hơn = experiment ARM riêng, không đổi baseline.
  cadence:
    # ⚠⚠ MẶC ĐỊNH LÀ **false** — NHỊP THUỘC SẢN PHẨM, KHÔNG THUỘC SIM (Cường chất vấn
    # 2026-07-29; `tracking/PLAN-2026-07-29-cadence-thuoc-san-pham.md`).
    #
    #   SIM trả lời: *"nội dung lời khuyên có giá trị không?"* — tức đo TRẦN giá trị advisor.
    #   SẢN PHẨM trả lời: *"advisor nói bao nhiêu là không phiền?"*
    #
    # Cooldown 20′ và ngân sách 6/ca là **ngân sách CHÚ Ý của người nghe** ⇒ ràng buộc UX của
    # sản phẩm, không phải thuộc tính của lời khuyên. Để chúng bật trong sim làm sim trả lời
    # câu thứ hai trong khi mọi người đọc nó như câu thứ nhất — và đo được là nó LÀM BẨN phép
    # đo giá trị từng kênh (tương tác FIFO +3.249đ, artifact 37).
    #
    # Cái giữ phép đo khỏi washout là `DECISION_BUCKET_MIN` 30′ + `_claim_effect`, **KHÔNG
    # phải** cooldown — đã chứng minh: tắt nhịp, decision-level vẫn lệch danh nghĩa +0,057
    # (arm bật: +0,055). Test khoá `test_tat_nhip_khong_lam_washout_song_lai` (5 seed).
    #
    # ⚠ **LUẬT ĐO khi nhịp TẮT: KHÔNG dùng event-level adherence, chỉ dùng decision-level.**
    # Không cooldown ⇒ số lần HỎI phụ thuộc CÂU TRẢ LỜI (bucket bị bỏ qua bị hỏi 4,93 lần,
    # bucket được nghe theo 2,38 lần) ⇒ event-level đếm thiếu followed, lệch tới 17đp.
    #
    # Bật `true` để chạy arm **"sản phẩm-như-thiết-kế"** — cơ chế còn nguyên, chỉ đổi mặc định.
    # `enabled` CHỈ điều khiển các CỔNG; `adherence_coin` keyed là VÔ ĐIỀU KIỆN (Lỗi #13).
    enabled: false
    min_gap_min_per_topic: 20        # cooldown mỗi chủ đề
    max_proactive_per_shift: 6       # ngân sách advice chủ động mỗi ca
    # positioning NGOÀI ngân sách: là kênh DUY NHẤT đã chứng minh dương SIG (+4.000đ,
    # artifact 29). Bật cờ này để ĐO arm siết, đừng mặc định (xem docstring bridge).
    # ⚠ Cờ này điều khiển ĐỐI XỨNG: tắt thì positioning vừa không TIÊU ngân sách vừa không
    # BỊ nó chặn (call site short-circuit) — đã kiểm bằng đo, không kênh `positioning` nào
    # nằm trong danh sách bị nén ở config mặc định.
    count_positioning_in_budget: false

  adherence_by_archetype:
    P1: 0.55
    P2: 0.50
    P3: 0.30
    P4: 0.75
    P5: 0.30
    P6: 0.50
    P7: 0.50

# AdviceCheckpoint trace/presenter is observational only in the simulator. Keep both
# gates off/template by default so enabling trace capture cannot enable an agent or
# alter world dynamics (UPDATE-126).
checkpoint_shadow:
  enabled: false
  presentation_mode: template

