[project]
name = "gsm-sim"
version = "0.1.0"
description = "Nền tảng Dữ liệu & Simulator Mô phỏng Môi trường Tài xế Xe điện (Digital Twin Synthetic Data Engine)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "h3>=4.1",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "scipy>=1.12",
    # gop tu lcx-core (GSM_FRAUD_DETECTION), sap nhap 2026-09-21
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
gsm-sim = "gsm_sim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_sim", "src/gsm_core", "src/lcx_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
